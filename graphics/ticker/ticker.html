<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YCS Ticker</title>
  <link rel="stylesheet" href="./ticker.css">
  <script src="./adapters/spx.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script>
    window.SPXGCTemplateDefinition = {
  "description": "YCS Ticker",
  "playserver": "OVERLAY",
  "playchannel": "1",
  "playlayer": "1",
  "webplayout": "1",
  "steps": "1",
  "out": "manual",
  "uicolor": "2",
  "dataformat": "json",
  "DataFields": [
    {
      "field": "f2",
      "ftype": "checkbox",
      "title": "Show rounds remaining",
      "value": "0"
    },
    {
      "field": "f3",
      "ftype": "textfield",
      "title": "Rounds remaining text",
      "value": ""
    },
    {
      "field": "f4",
      "ftype": "textfield",
      "title": "Status",
      "value": ""
    },
    {
      "field": "f5",
      "ftype": "textfield",
      "title": "Current round",
      "value": ""
    },
    {
      "field": "f6",
      "ftype": "textfield",
      "title": "Day / date",
      "value": ""
    },
    {
      "field": "f7",
      "ftype": "textfield",
      "title": "Location",
      "value": ""
    },
    {
      "field": "f8",
      "ftype": "number",
      "title": "Crawl speed (pixels / second)",
      "value": "145"
    },
    {
      "field": "f9",
      "ftype": "number",
      "title": "Topic entry delay (ms)",
      "value": "180"
    },
    {
      "field": "f10",
      "ftype": "number",
      "title": "Header transition (ms)",
      "value": "180"
    },
    {
      "field": "f11",
      "ftype": "filelist",
      "title": "Logo",
      "assetfolder": "./assets/",
      "extension": "png",
      "value": "./assets/ycs-logo.png"
    },
    {
      "field": "f12",
      "ftype": "filelist",
      "title": "Background artwork",
      "assetfolder": "./assets/",
      "extension": "png",
      "value": "./assets/ticker-background.png"
    },
    {
      "field": "f1",
      "ftype": "textarea",
      "title": "Additional data overrides (JSON)",
      "value": "{}"
    },
    {
      "field": "f14",
      "ftype": "textarea",
      "title": "Stories",
      "value": "[]",
      "ycsCollection": {
        "version": 1,
        "fields": [
          {
            "key": "category",
            "title": "Category"
          },
          {
            "key": "topic",
            "title": "Topic"
          },
          {
            "key": "subtopic",
            "title": "Crawler text",
            "required": true,
            "aliases": [
              "Subtopic",
              "Message"
            ]
          }
        ]
      }
    }
  ]
};
  </script>
</head>

<body>
  <div id="ticker" aria-label="Broadcast ticker">
    <img id="bg" src="./assets/ticker-background.png" alt="">
    <img id="logo" src="./assets/ycs-logo.png" alt="Event logo">
    <div id="left">
      <div id="date"></div>
      <div id="location"></div>
    </div>
    <div id="center">
      <div id="topicbar">
        <div id="topic-inner"><span id="category"></span><span id="topic"></span></div>
      </div>
      <div id="crawl-viewport">
        <div id="crawl-track"></div>
      </div>
    </div>
    <div id="right">
      <div id="status"></div>
      <div id="round-box">
        <div id="round"></div>
      </div>
      <div id="remaining"></div>
    </div>
  </div>
</body>

</html>
