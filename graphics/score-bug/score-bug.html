<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>YCS Score Bug</title>
    <link rel="stylesheet" href="./score-bug.css" />
    <script>
      window.SPXGCTemplateDefinition = {
        description: 'YCS Score Bug',
        playserver: 'OVERLAY',
        playchannel: '1',
        playlayer: '3',
        webplayout: '3',
        steps: '1',
        out: 'manual',
        uicolor: '2',
        dataformat: 'json',
        ycsSlot: 'ticker',
        editorSections: [
          { placement: 'header', fields: ['f15'] },
          { title: 'Round', fields: ['f5', 'f16'] },
          { title: 'Left player', fields: ['f4', 'f7', 'f9'] },
          { title: 'Right player', fields: ['f6', 'f8', 'f10'] }
        ],
        DataFields: [
          { field: 'f5', ftype: 'textfield', title: 'Current round', value: 'ADVANCED ROUND 10 OF 15' },
          { field: 'f4', ftype: 'textfield', title: 'Left player', value: 'CREIGHTON P.' },
          { field: 'f7', ftype: 'filelist', title: 'Left flag', assetfolder: './assets/', extension: 'png', value: './assets/us.png', ycsPrimary: true },
          { field: 'f6', ftype: 'textfield', title: 'Right player', value: 'THOMAS G.' },
          { field: 'f8', ftype: 'filelist', title: 'Right flag', assetfolder: './assets/', extension: 'png', value: './assets/us.png', ycsPrimary: true },
          { field: 'f9', ftype: 'number', title: 'Left score', min: 0, value: '0', ycsPrimary: true },
          { field: 'f10', ftype: 'number', title: 'Right score', min: 0, value: '0', ycsPrimary: true },
          { field: 'f15', ftype: 'checkbox', title: 'Custom', value: '0' },
          { field: 'f16', ftype: 'textfield', title: 'Custom text', value: '' }
        ]
      };
    </script>
  </head>
  <body>
    <div id="score-bug" aria-label="match score">
      <div class="bar blue">
        <div class="shell"><div class="fill"></div></div>
        <div class="name-mask"><div class="name-motion"><span class="name" data-fit data-field="leftName"></span></div></div>
        <div class="flag-mask"><img class="flag" data-image="leftFlag" src="./assets/us.png" alt="" /></div>
        <div class="score-mask"><div class="score-motion"><span class="score" data-field="leftScore"></span></div></div>
      </div>
      <div class="bar red">
        <div class="shell"><div class="fill"></div></div>
        <div class="score-mask"><div class="score-motion"><span class="score" data-field="rightScore"></span></div></div>
        <div class="flag-mask"><img class="flag" data-image="rightFlag" src="./assets/us.png" alt="" /></div>
        <div class="name-mask"><div class="name-motion"><span class="name" data-fit data-field="rightName"></span></div></div>
      </div>
      <div class="round-mask">
        <div class="round-box">
          <div class="round-room"><span class="round" data-fit data-field="currentRound"></span></div>
          <div class="caption-room"><span class="caption" data-fit>MATCH COMPLETE</span></div>
        </div>
      </div>
    </div>
    <script src="./spx.js"></script>
  </body>
</html>
